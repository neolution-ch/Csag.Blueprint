name: NuGet Preview

# Publishes every package of a pull request to the public feedz.io preview feed, so an
# application can be pointed at unreleased changes and validated end to end without burning
# a nuget.org version. Restoring from the feed needs no credentials. The feed's retention
# rule prunes previews after 30 days, so nothing here deletes old versions.
on:
    pull_request:
        branches:
            - main
            - "release/**"
        types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same PR supersedes the build in flight.
concurrency:
    group: nuget-preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

env:
    FEED_URL: https://f.feedz.io/collana-solutions/csag-blueprint/nuget/index.json

jobs:
    publish:
        name: Publish preview packages
        # Fork and Dependabot PRs don't get the FEEDZ_TOKEN secret.
        if: >-
            !github.event.pull_request.draft &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Setup .NET
              uses: actions/setup-dotnet@v6.0.0
              with:
                  global-json-file: global.json

            - name: Compute preview version
              id: version
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  # A feature PR carries the current release in package.json, so its preview goes
                  # one patch above it. The changesets release PR already carries the upcoming
                  # version, so its preview is a release candidate just below that release.
                  # Either way the preview sorts after the current release, and a consumer that
                  # moves only some Csag.Blueprint.* packages to it gets a NU1605 downgrade error
                  # instead of a silent mix. The run number makes every push a new version,
                  # because NuGet caches packages by id and version and never downloads the same
                  # version twice.
                  BASE=$(node -p "require('./packages/Csag.Blueprint.Domain/package.json').version")
                  IFS=. read -r MAJOR MINOR PATCH <<< "${BASE%%-*}"
                  if [[ "$HEAD_REF" != changeset-release/* ]]; then
                      PATCH=$((PATCH + 1))
                  fi
                  echo "version=${MAJOR}.${MINOR}.${PATCH}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

            - name: Remove changesets version-tracking stubs
              run: |
                  # Remove package.json files so they don't leak into the NuGet packages
                  find packages/ -name "package.json" -delete

            - name: Restore
              run: dotnet restore --locked-mode

            # Version is a global property, so it also becomes the version of the dependencies
            # between the six packages.
            - name: Pack
              run: dotnet pack --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }} -o ./nupkgs

            - name: Push to feedz.io
              env:
                  FEEDZ_TOKEN: ${{ secrets.FEEDZ_TOKEN }}
              run: |
                  dotnet nuget push "./nupkgs/*.nupkg" \
                    --api-key "$FEEDZ_TOKEN" \
                    --source "$FEED_URL" \
                    --skip-duplicate

            # Sticky PR comment, updated in place on every push.
            - name: Comment preview version
              uses: actions/github-script@v9
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              with:
                  script: |
                      const marker = '<!-- nuget-preview -->';
                      const { VERSION: version } = process.env;
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const sha = context.payload.pull_request.head.sha.slice(0, 7);

                      const body = [
                          marker,
                          '### NuGet preview packages',
                          '',
                          `\`${version}\` for ${sha} is on the [preview feed](${context.serverUrl}/${owner}/${repo}#preview-packages). Set every \`Csag.Blueprint.*\` package to this version:`,
                          '',
                          '```xml',
                          `<PackageVersion Include="Csag.Blueprint.Web" Version="${version}" />`,
                          '```',
                      ].join('\n');

                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner,
                          repo,
                          issue_number,
                      });
                      const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));

                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }
