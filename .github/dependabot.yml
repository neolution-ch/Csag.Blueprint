version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # wait for a month before updating to minimize the risk of supply chain attacks
    cooldown:
      default-days: 30
    groups:
      github-actions:
        patterns:
          - "*"
      # groups default to `applies-to: version-updates`, so security PRs need their own entry.
      # note: cooldown does not apply to security updates, they still land immediately.
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # wait for 14 days before updating to minimize the risk of supply chain attacks
    cooldown:
      default-days: 14
    ignore:
      # ignore major version updates for specific dependencies because we want to match them to the .dotnet version
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text*"
        update-types: ["version-update:semver-major"]
      # waiting for the nlog target to also be updated to 3.x
      # https://www.nuget.org/packages/Microsoft.ApplicationInsights.NLogTarget/
      - dependency-name: "Microsoft.ApplicationInsights*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-ecosystem:
        patterns:
          - "*"
      nuget-ecosystem-security:
        applies-to: security-updates
        patterns:
          - "*"

  # pnpm dependencies: the changesets release tooling at the repo root.
  # Dependabot handles pnpm workspaces under the "npm" ecosystem.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # wait for 14 days before updating to minimize the risk of supply chain attacks
    cooldown:
      default-days: 14
    groups:
      npm-ecosystem:
        patterns:
          - "*"
      npm-ecosystem-security:
        applies-to: security-updates
        patterns:
          - "*"
