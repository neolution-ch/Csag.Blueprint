name: Release

on:
  push:
    branches:
      - main
      - "release/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CHANGESETS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Activates the pnpm version pinned in package.json's "packageManager".
      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine publish config
        id: publish-config
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            # Extract major version from branch name (e.g., release/v1.x → release-v1)
            BRANCH="${{ github.ref_name }}"
            TAG=$(echo "$BRANCH" | sed -n 's|release/v\([0-9]*\)\..*|release-v\1|p')
            echo "tag=--tag $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: node scripts/sync-versions.mjs
          publish-script: pnpm exec changeset publish ${{ steps.publish-config.outputs.tag }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

      - name: Create release branch on major version bump
        if: steps.changesets.outputs.published == 'true' && github.ref ==
          'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const published = JSON.parse('${{ steps.changesets.outputs.published-packages }}');
            if (!published.length) return;

            const newVersion = published[0].version;
            const newMajor = parseInt(newVersion.split('.')[0], 10);

            // Only act on stable major bumps (not prereleases)
            if (newVersion.includes('-') || newMajor < 1) return;

            const prevMajor = newMajor - 1;
            const branchName = `release/v${prevMajor}.x`;

            // Check if the branch already exists
            try {
                await github.rest.repos.getBranch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    branch: branchName,
                });
                console.log(`Branch ${branchName} already exists, skipping.`);
                return;
            } catch (e) {
                if (e.status !== 404) throw e;
            }

            // Find the last tag for the previous major version
            const tags = await github.paginate(github.rest.repos.listTags, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
            });

            // Newest stable release of the previous major. Only tags of the packages just
            // published (or bare vX.Y.Z tags) count, and versions are compared numerically
            // because the tag list API does not return tags in version order.
            const publishedNames = new Set(published.map(p => p.name));
            const prevTag = tags
                .map(t => {
                    const match = t.name.match(/^(?:(.+)@|v)?(\d+)\.(\d+)\.(\d+)$/);
                    if (!match || (match[1] !== undefined && !publishedNames.has(match[1]))) return null;
                    return { tag: t, version: [match[2], match[3], match[4]].map(Number) };
                })
                .filter(c => c && c.version[0] === prevMajor)
                .sort((a, b) => b.version[1] - a.version[1] || b.version[2] - a.version[2])[0]?.tag;

            if (!prevTag) {
                console.log(`No tag found for v${prevMajor}, skipping branch creation.`);
                return;
            }

            // Create the branch from the previous major's last tag
            try {
                await github.rest.git.createRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `refs/heads/${branchName}`,
                    sha: prevTag.commit.sha,
                });
                console.log(`Created ${branchName} from tag ${prevTag.name} (${prevTag.commit.sha}).`);
            } catch (e) {
                // GitHub can refuse GITHUB_TOKEN when branching from an older commit (403). The
                // release itself already succeeded, so warn with the manual command instead of failing.
                if (e.status !== 403) throw e;
                core.warning(
                    `Could not create ${branchName} from ${prevTag.name}: ${e.message}. ` +
                        `Create it by hand: git push origin ${prevTag.commit.sha}:refs/heads/${branchName}`,
                );
            }
