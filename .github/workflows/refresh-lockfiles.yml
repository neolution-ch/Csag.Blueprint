name: Refresh lockfiles

# Regenerates the pnpm and NuGet lock files so that transitive dependencies are
# refreshed to the newest versions still allowed by the declared semver ranges.
#
# Why this exists: Dependabot version updates only bump *direct* dependencies.
# Transitive dependencies are only ever touched when a security advisory forces a
# lockfile patch, so they accumulate staleness for months. This scheduled job
# re-resolves the lock files within the existing ranges (no range bumps), opens a
# PR with the diff, and lets CI + a human review catch any regression before it
# merges. See BLUEAPI-75.
#
# The two ecosystems behave very differently here, which is worth knowing before
# reading a diff (or an empty one):
#
#   pnpm  resolves the HIGHEST version matching each range, so re-resolving after
#         deleting the lock file genuinely pulls newer transitives. This is the
#         half that does the work.
#   NuGet resolves the LOWEST applicable version instead, and every version in
#         Directory.Packages.props is an exact pin, so re-evaluation normally
#         reproduces an identical graph. It is kept for the narrow case where a
#         locked version has been unlisted from the feed and has to re-resolve.
#
# A second job, prune-transitive-pins, removes the NuGet transitive pins that are
# no longer needed and opens its own PR. See the comment above that job.

on:
  # First day of every month at 08:00 UTC. Running monthly (rather than weekly)
  # keeps PR noise low and means freshly published transitives have already had
  # time to "age" past the Dependabot cooldown windows (14 days).
  schedule:
    - cron: "0 8 1 * *"
  # Allow maintainers to trigger an on-demand refresh from the Actions tab.
  # A dry run writes what each job would change to the run summary and opens
  # no PR.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: report the changes, open no pull request"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # -----------------------------------------------------------------------
      # NuGet — refresh the transitive versions inside every packages.lock.json.
      #
      # We use `dotnet restore --force-evaluate` instead of deleting the lock
      # files. `--force-evaluate` re-resolves every dependency within its declared
      # range and rewrites the existing lock files in place. It is the idiomatic,
      # surgical way to refresh transitives and avoids any window where the lock
      # files are missing. (Deleting them would also work here because
      # RestorePackagesWithLockFile=true is set in Directory.Build.props, but
      # force-evaluate is cleaner.)
      #
      # Central Package Management with transitive pinning is enabled, so the
      # whole solution is restored in one pass and every project's
      # packages.lock.json is updated.
      # -----------------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Refresh NuGet lock files
        run: dotnet restore --force-evaluate

      # -----------------------------------------------------------------------
      # pnpm — delete + reinstall so the lock file is fully re-resolved to the
      # newest versions allowed by the ranges in package.json. pnpm always writes
      # a fresh lock file on install, so removing it first is the most reliable
      # way to pick up new transitives.
      #
      # corepack activates the exact pnpm version pinned in package.json's
      # "packageManager" field, matching how CI installs dependencies.
      #
      # Note: pnpm refuses to resolve releases younger than its minimumReleaseAge
      # window and, unless minimumReleaseAgeStrict is set, records the ones it
      # allowed through in pnpm-workspace.yaml. That file may therefore appear in
      # the diff alongside the lock file.
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Refresh pnpm lock file
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile

      - name: Report changes (dry run)
        if: inputs.dry-run == true
        run: |
          {
            echo "## Lockfile refresh (dry run)"
            echo
            if [ -z "$(git status --porcelain)" ]; then
              echo "No lock file changed."
            else
              echo '```text'
              git diff --stat
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # Changeset
      #
      # The CI Changeset Check fails a PR that changes a package and has no
      # changeset. The Dependabot Changeset workflow writes changesets only for
      # Dependabot PRs. Thus, this job writes its own changeset. It uses the
      # same script and the same rules as the Dependabot Changeset workflow:
      #   - A change to packages/*/packages.lock.json gives a patch for the
      #     fixed package group.
      #   - Other changes give an empty changeset.
      # If the refresh does not change a file, this step does nothing.
      # -----------------------------------------------------------------------
      - name: Add changeset
        if: inputs.dry-run != true
        env:
          PR_TITLE: "chore: refresh lockfiles (transitive dependency update)"
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No lock file changed, so no changeset is needed"
            exit 0
          fi
          if [ -n "$(git status --porcelain -- 'packages/*/packages.lock.json')" ]; then
            export WORKSPACE_PACKAGES_CHANGED=true
          fi
          node scripts/generate-dependabot-changeset.mjs

      # -----------------------------------------------------------------------
      # Open or update one PR with the changes.
      #
      # The job opens the PR with a token of the csag-changesets-bot GitHub App.
      # GitHub does not start `pull_request` workflows for a push with
      # GITHUB_TOKEN. This rule prevents workflow loops. With the app token, CI
      # starts on the PR. The token is valid only for this repository and has
      # only the two permissions below. The action masks the token in the log
      # and revokes it at the end of the job. No step prints the token.
      # -----------------------------------------------------------------------
      - name: Generate App Token
        if: inputs.dry-run != true
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CHANGESETS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        if: inputs.dry-run != true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/refresh-lockfiles
          delete-branch: true
          commit-message: "chore: refresh lockfiles (transitive dependency update)"
          title: "chore: refresh lockfiles (transitive dependency update)"
          body: |
            ## Scheduled lockfile refresh

            This PR was opened automatically by the **Refresh lockfiles** workflow.
            It regenerates the pnpm (`pnpm-lock.yaml`) and NuGet
            (`packages.lock.json`) lock files to pick up the newest transitive
            dependency versions that still satisfy the declared semver ranges.

            ### Why
            Dependabot only bumps *direct* dependencies. Transitive dependencies
            are otherwise never refreshed unless a security advisory forces a
            patch — so they accumulate staleness (bug fixes, perf improvements)
            and the eventual forced jump is large and risky. This keeps them
            current in small, reviewable increments.

            ### What changed
            - pnpm: `pnpm-lock.yaml` regenerated from scratch, re-resolving every
              range to its newest matching version.
            - NuGet: `dotnet restore --force-evaluate` re-resolved all lock files
              within their existing version ranges (no range bumps). NuGet takes
              the *lowest* applicable version, so an empty NuGet diff is the
              expected result, not a failure.

            ### Safety
            - Only resolves **within** the existing version ranges — no range
              changes were made to `package.json` / `Directory.Packages.props`.
            - pnpm's `minimumReleaseAge` policy still applies, so freshly
              published releases are not pulled in.
            - CI runs on this PR; review the diff before merging.

            > Note on release age: Dependabot enforces a 14-day cooldown on its
            > own PRs, and pnpm's `minimumReleaseAge` gates what this job can
            > resolve.

  # ---------------------------------------------------------------------------
  # Transitive pins
  #
  # A transitive pin is a <PackageVersion> for a package that no project
  # references directly. It raises a version that a dependency pulls in, usually
  # to clear a security advisory. NuGet resolves the lowest version a dependency
  # allows, so the pin stays necessary until the parent package itself requires
  # a fixed version, and nothing notices when that happens. Dependabot keeps
  # bumping the pin instead.
  #
  # This job deletes each pin in turn, re-resolves the lock files and runs the
  # NuGet vulnerability scan. A deletion is kept when the scan reports nothing
  # new. A pin marked KeepPin="true" is left alone. The details are in
  # scripts/prune-transitive-pins.mjs.
  #
  # It opens its own PR rather than adding to the refresh PR. Pack writes
  # transitive pins into the nuspec of every package that resolves them, so
  # removing one changes the published packages and needs a release. A
  # reviewer can also turn a removal down without holding up the refresh.
  # ---------------------------------------------------------------------------
  prune-transitive-pins:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # One restore and one vulnerability scan per pin, about a minute each.
      - name: Prune transitive pins
        run: |
          node scripts/prune-transitive-pins.mjs ${{ inputs.dry-run && '--dry-run' || '' }} "$RUNNER_TEMP/prune-report.md"
          cat "$RUNNER_TEMP/prune-report.md" >> "$GITHUB_STEP_SUMMARY"

      # Same rules as the changeset step of the refresh job above.
      - name: Add changeset
        if: inputs.dry-run != true
        env:
          PR_TITLE: "chore: remove transitive pins that are no longer needed"
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No pin was removed, so no changeset is needed"
            exit 0
          fi
          if [ -n "$(git status --porcelain -- 'packages/*/packages.lock.json')" ]; then
            export WORKSPACE_PACKAGES_CHANGED=true
          fi
          node scripts/generate-dependabot-changeset.mjs

      - name: Generate App Token
        if: inputs.dry-run != true
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CHANGESETS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # With no pin removed there is no diff, and the action opens no PR.
      - name: Create Pull Request
        if: inputs.dry-run != true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/prune-transitive-pins
          delete-branch: true
          commit-message: "chore: remove transitive pins that are no longer needed"
          title: "chore: remove transitive pins that are no longer needed"
          body-path: ${{ runner.temp }}/prune-report.md
