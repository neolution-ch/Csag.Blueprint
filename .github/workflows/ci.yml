name: CI

on:
    pull_request:
        branches:
            - main
            - "release/**"

jobs:
    changeset-check:
        name: Changeset Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            # Activates the pnpm version pinned in package.json's "packageManager".
            - name: Enable Corepack
              run: corepack enable

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Check for changesets
              if: github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'changeset-release/release/')
              run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

    build:
        name: Build, Test & Pack
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: read
            checks: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Setup .NET
              uses: actions/setup-dotnet@v6.0.0
              with:
                  global-json-file: global.json

            - name: Restore
              run: dotnet restore --locked-mode

            - name: Build
              run: dotnet build --configuration Release --no-restore

            # GitHubActionsTestLogger writes failure annotations and the job summary from
            # inside the run (no token needed); the TRX files feed the PR comment below.
            - name: Test
              run: dotnet test --configuration Release --no-build --logger GitHubActions --logger trx --results-directory ./test-results

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results
                  path: ./test-results
                  retention-days: 7

            # Sticky PR comment with per-suite totals, updated in place on every push.
            - name: Publish test results
              if: always()
              uses: EnricoMi/publish-unit-test-result-action@v2.24.0
              with:
                  files: ./test-results/**/*.trx

            - name: Pack (smoke test)
              run: dotnet pack --configuration Release --no-build -o ./nupkgs

            - name: Upload packages
              uses: actions/upload-artifact@v7
              with:
                  name: nupkgs
                  path: ./nupkgs
                  retention-days: 7
